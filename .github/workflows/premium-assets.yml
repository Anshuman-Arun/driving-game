name: Acquire premium CC0 world assets
on:
  push:
    branches: [feat/gfx-premium-assets]
    paths:
      - 'tools/premium_assets/**'
      - 'assets/premium_world/catalog.json'
      - '.github/workflows/premium-assets.yml'
permissions:
  contents: write
concurrency:
  group: premium-world-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/feat/gfx-premium-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Validate acquisition script and catalog
        run: |
          python3 -m py_compile tools/premium_assets/acquire.py
          python3 tools/premium_assets/acquire.py --plan
      - name: Download and verify complete source pack
        run: |
          python3 tools/premium_assets/acquire.py
          python3 tools/premium_assets/acquire.py --verify
      - name: Publish only the verified asset payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/premium_world/payload
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: add verified Poly Haven premium world source pack"
          git push origin HEAD:refs/heads/feat/gfx-premium-assets
