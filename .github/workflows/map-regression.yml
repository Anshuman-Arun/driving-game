name: Map and gameplay regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: World data and race authoring
        run: |
          node worldgen/tests/test_world.js
          node worldgen/tests/test_turns.js
          node modules/world_runtime/tests/verify_world_data.mjs data/world
          node content/races/tests/test_author.js
          python -m py_compile content/scenery/tools/bake_roadworks.py content/scenery/tools/bake_vegetation.py
      - name: Traffic and audio data regressions
        run: |
          python modules/traffic/tests/fixture_checks.py
          python modules/traffic/tests/reference_flow_sim.py
          python modules/audio/tests/test_assets.py
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -s /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import root game
        run: |
          set -o pipefail
          godot --headless --path . --editor --import 2>&1 | tee /tmp/root-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/root-import.log; then exit 1; fi
      - name: Root regression suites
        if: success()
        shell: bash
        run: |
          set +e
          failed=0
          for script in tests/core/smoke.gd tests/core/steering_camera.gd tests/core/drift_and_controller.gd tests/integration/map_width_check.gd tests/integration/roadworks_check.gd tests/integration/garage_world.gd tests/integration/vehicle_world.gd modules/vehicle_visuals/tests/smoke.gd tests/integration/forza_showcase_qa.gd; do
            echo "::group::$script"
            timeout 240 godot --headless --path . --fixed-fps 60 --script "res://$script" 2>&1 | tee /tmp/test.log
            status=${PIPESTATUS[0]}
            if [ "$status" != 0 ] || grep -E 'SCRIPT ERROR|Parse Error|FAIL ' /tmp/test.log; then
              failed=1
              echo "FAIL: $script (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PASS: $script" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          exit "$failed"
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install pinned Godot
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo ln -s /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Standalone regression suites
        shell: bash
        run: |
          set +e
          failed=0
          run() {
            echo "::group::$*"
            timeout 240 "$@" 2>&1 | tee /tmp/test.log
            status=${PIPESTATUS[0]}
            if [ "$status" != 0 ] || grep -E 'SCRIPT ERROR|Parse Error|FAIL ' /tmp/test.log; then
              failed=1
              echo "FAIL: $* (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PASS: $*" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          }
          mkdir -p modules/scenery/.world_source modules/scenery/staged_art modules/scenery/staged_models
          cp data/world/road_graph_v1.json data/world/world_metadata_v1.json data/world/terrain_height_r16le.bin modules/scenery/.world_source/ || exit 1
          cp -a assets/curated/. modules/scenery/staged_art/ || exit 1
          cp -a content/scenery/models/. modules/scenery/staged_models/ || exit 1
          for module in world_runtime traffic racing audio game_shell scenery; do
            run godot --headless --path "modules/$module" --editor --import
          done
          run godot --headless --path modules/world_runtime --script res://tests/smoke.gd -- --full-world
          run godot --headless --path modules/traffic --script res://tests/run_tests.gd
          run godot --headless --path modules/traffic --script res://tests/run_junction_safety.gd
          run godot --headless --path modules/racing --script res://tests/run_tests.gd
          run godot --headless --path modules/racing --script res://tests/run_grid_tests.gd
          run godot --headless --path modules/racing --script res://tests/run_production_tests.gd -- --graph="$PWD/data/world/road_graph_v1.json" --events="$PWD/content/races/events_v1.json"
          run godot --headless --path modules/audio --script res://tests/godot_smoke.gd
          run godot --headless --path modules/audio --script res://tests/godot_regression.gd
          run godot --headless --path modules/game_shell --script res://tests/run_tests.gd
          run godot --headless --path modules/scenery --script res://tests/smoke.gd
          exit "$failed"
