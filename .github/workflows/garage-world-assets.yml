name: Acquire garage and world source assets
on:
  push:
    branches: [feat/premium-garage-world-assets]
    paths:
      - 'tools/garage_world_assets/**'
      - 'assets/premium_garage_world/catalog.json'
      - '.github/workflows/garage-world-assets.yml'
permissions:
  contents: write
concurrency:
  group: garage-world-assets
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/feat/premium-garage-world-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          sparse-checkout: |
            assets/premium_garage_world
            tools/garage_world_assets
            .gitattributes
      - name: Acquire and verify source models
        run: |
          python3 -m py_compile tools/garage_world_assets/acquire.py
          python3 tools/garage_world_assets/acquire.py
          python3 tools/garage_world_assets/acquire.py --verify
      - name: Commit verified payload to asset branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/premium_garage_world/payload
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: publish verified garage and world source models"
          git push origin HEAD:refs/heads/feat/premium-garage-world-assets
