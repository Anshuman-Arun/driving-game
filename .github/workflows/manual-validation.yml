name: Manually validate an existing branch

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Which standalone test suite should run?"
        required: true
        type: choice
        options: [core, racing, traffic, world, art]
      branch:
        description: "Existing branch to validate; leave empty for the track's default feature branch"
        required: false
        type: string

permissions:
  contents: read

jobs:
  selected-branch:
    name: "${{ inputs.track }} — selected branch"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout CI scripts from workflow ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false
      - name: Resolve and validate selected branch
        id: selected
        shell: bash
        env:
          TRACK: "${{ inputs.track }}"
          OVERRIDE_BRANCH: "${{ inputs.branch }}"
        run: |
          set -euo pipefail
          case "$TRACK" in
            core) default=feat/core-driving ;;
            racing) default=feat/racing-systems ;;
            traffic) default=feat/traffic-systems ;;
            world) default=feat/worldgen ;;
            art) default=feat/art-pipeline ;;
            *) echo "::error::Unknown test suite"; exit 2 ;;
          esac
          branch="${OVERRIDE_BRANCH:-$default}"
          git check-ref-format --branch "$branch" >/dev/null || {
            echo "::error::Invalid git branch name"; exit 2;
          }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Selected existing branch: $branch"
      - name: Checkout selected branch (fail if nonexistent)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: "${{ steps.selected.outputs.branch }}"
          path: worktree
          persist-credentials: false
      - name: Pin Node.js 22.16.0
        if: inputs.track == 'world' || inputs.track == 'art'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Pin Python 3.12.12
        if: inputs.track == 'traffic' || inputs.track == 'art'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - name: Install verified Godot 4.7.2
        if: inputs.track != 'world'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-out
          bash ci/tools/ci/install_godot.sh "$RUNNER_TEMP/godot/bin" 2>&1 | tee ci-out/install-godot.log
      - name: Execute selected workstream suite
        shell: bash
        env:
          TRACK: "${{ inputs.track }}"
        run: |
          set -euo pipefail
          bash ci/tools/ci/run_workstream.sh "$TRACK" "$GITHUB_WORKSPACE/worktree" "$GITHUB_WORKSPACE/ci-out" "$GITHUB_WORKSPACE/ci/tools/ci"
      - name: Publish execution status (no graphical claims)
        if: always()
        shell: bash
        run: |
          if [[ -f ci-out/SUMMARY.md ]]; then
            cat ci-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### NOT EXECUTED\n\nBranch checkout or dependency setup failed before tests ran. Inspect job logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain logs and evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-${{ inputs.track }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Warn and surface logs when artifact storage is unavailable
        if: always() && steps.upload.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Artifact upload failed; GitHub Actions job logs and the job summary remain available. Test status is unaffected."
          {
            printf '### Artifact upload unavailable\n\nGitHub rejected the log archive (repository storage quota may be full). Full command output is retained in this Actions job log.\n\n'
            for file in ci-out/*.log; do
              [[ -f "$file" ]] || continue
              printf '#### %s — last 35 lines\n\n' "$(basename "$file")"
              tail -n 35 "$file" | sed 's/^/    /'
              printf '\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"
