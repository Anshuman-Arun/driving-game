name: Hero continuous-recording research
on:
  push:
    branches: [feat/hero-supercar-audio]
    paths: ['modules/audio/tools/continuous_sweep_research.py', '.github/workflows/hero-sweep-research.yml']
  pull_request:
    branches: [feat/aster-scenic-supercars]
    paths: ['modules/audio/tools/continuous_sweep_research.py', '.github/workflows/hero-sweep-research.yml']
  workflow_dispatch:
    inputs:
      fetch_originals:
        description: 'Retry original Commons recordings (only after rate limit resolves)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hero-sweep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Prepare analysis environment
        run: |
          python -m venv "$RUNNER_TEMP/audio-research-venv"
          "$RUNNER_TEMP/audio-research-venv/bin/pip" install numpy==2.3.5 scipy==1.17.0 imageio-ffmpeg==0.6.0
          "$RUNNER_TEMP/audio-research-venv/bin/python" -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
      - name: Analyze cached CC0 recording (unconfirmed engine identity)
        run: |
          "$RUNNER_TEMP/audio-research-venv/bin/python" modules/audio/tools/continuous_sweep_research.py --local assets/audio/recorded/candidates/car_engine_512558.mp3 --profile mclaren_senna --output "$RUNNER_TEMP/hero-sweep-research/cc0-candidate"
      - name: Fetch original recordings (user requested reference comparison)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.fetch_originals)
        run: |
          "$RUNNER_TEMP/audio-research-venv/bin/python" modules/audio/tools/continuous_sweep_research.py --download --output "$RUNNER_TEMP/hero-sweep-research/originals"
      - name: Upload candidate reports and previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hero-sweep-research
          path: ${{ runner.temp }}/hero-sweep-research/
          retention-days: 7
