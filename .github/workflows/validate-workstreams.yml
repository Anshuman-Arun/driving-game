name: Independent workstream validation

on:
  push:
    branches: [main, feat/ci-validation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scripts:
    name: CI script syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout CI source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tracked CI scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/install_godot.sh tools/ci/run_workstream.sh
          python3 -m py_compile tools/ci/check_art_manifest.py
          git diff --check

  validate:
    name: "${{ matrix.track }} — ${{ matrix.branch }}"
    needs: ci-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: core
            branch: feat/core-driving
          - track: racing
            branch: feat/racing-systems
          - track: traffic
            branch: feat/traffic-systems
          - track: world
            branch: feat/worldgen
          - track: art
            branch: feat/art-pipeline
    steps:
      - name: Checkout trusted CI scripts from validation PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false
      - name: Checkout the explicit workstream branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: "${{ matrix.branch }}"
          path: worktree
          persist-credentials: false
      - name: Pin Node.js 22.16.0
        if: matrix.track == 'world' || matrix.track == 'art'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Pin Python 3.12.12
        if: matrix.track == 'traffic' || matrix.track == 'art'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.12"
      - name: Install official checksum-verified Godot 4.7.2
        if: matrix.track != 'world'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-out
          bash ci/tools/ci/install_godot.sh "$RUNNER_TEMP/godot/bin" 2>&1 | tee ci-out/install-godot.log
      - name: Run independent required tests
        shell: bash
        run: |
          set -euo pipefail
          bash ci/tools/ci/run_workstream.sh "${{ matrix.track }}" "$GITHUB_WORKSPACE/worktree" "$GITHUB_WORKSPACE/ci-out" "$GITHUB_WORKSPACE/ci/tools/ci"
      - name: Publish headless-only test summary
        if: always()
        shell: bash
        run: |
          if [[ -f ci-out/SUMMARY.md ]]; then
            cat ci-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### ${{ matrix.track }}: NOT EXECUTED\n\nCheckout, dependency setup or download failed before tests started. See step logs.\n\nHeadless success never establishes visual or controller correctness.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain failure and success evidence
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.track }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Warn and surface logs when artifact storage is unavailable
        if: always() && steps.upload.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Artifact upload failed; GitHub Actions job logs and the job summary remain available. Test status is unaffected."
          {
            printf '### Artifact upload unavailable\n\nGitHub rejected the log archive (repository storage quota may be full). Full command output is retained in this Actions job log.\n\n'
            for file in ci-out/*.log; do
              [[ -f "$file" ]] || continue
              printf '#### %s — last 35 lines\n\n' "$(basename "$file")"
              tail -n 35 "$file" | sed 's/^/    /'
              printf '\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"
