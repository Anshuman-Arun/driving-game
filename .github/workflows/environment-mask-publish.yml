name: Publish verified integration biome package
on:
  push:
    branches: [feat/env-integration]
    paths:
      - '.github/workflows/environment-mask-publish.yml'
      - 'content/scenery/environment_overhaul/bake_biomes.py'
      - 'content/scenery/environment_overhaul/requirements.txt'
permissions:
  contents: read
concurrency:
  group: environment-mask-publication
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'Anshuman-Arun/driving-game' && github.ref == 'refs/heads/feat/env-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r content/scenery/environment_overhaul/requirements.txt
      - name: Bake and independently verify canonical package
        run: |
          set -euo pipefail
          python content/scenery/environment_overhaul/bake_biomes.py --project . --output "$RUNNER_TEMP/masks" --seed 20261121
          python content/scenery/environment_overhaul/verify_package.py --project . --mask-dir "$RUNNER_TEMP/masks"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-biome-package
          path: ${{ runner.temp }}/masks/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: generate
    if: github.repository == 'Anshuman-Arun/driving-game' && github.ref == 'refs/heads/feat/env-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          ref: ${{ github.sha }}
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - uses: actions/download-artifact@v4
        with:
          name: verified-biome-package
          path: ${{ runner.temp }}/verified-mask
      - name: Validate artifact and publish only the four generated files
        shell: bash
        run: |
          set -euo pipefail
          branch=refs/heads/feat/env-integration
          remote="$(git ls-remote origin "$branch" | cut -f1)"
          test "$remote" = "$GITHUB_SHA" || { echo "Integration head changed; refusing publication"; exit 1; }
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil
          source = pathlib.Path(os.environ["RUNNER_TEMP"])/"verified-mask"
          dest = pathlib.Path("content/scenery/environment_overhaul/masks")
          expected = {"biome_rgba8.bin", "manifest.json", "understory.json", "statistics.json"}
          assert {p.name for p in source.iterdir()} == expected
          assert all(p.is_file() and not p.is_symlink() for p in source.iterdir())
          m = json.loads((source/"manifest.json").read_text())
          assert m["schema_version"] == 1 and m["width"] == m["height"] == 1000
          assert (source/"biome_rgba8.bin").stat().st_size == 4000000
          for filename, key in [("biome_rgba8.bin","sha256"),("understory.json","understory_sha256"),("statistics.json","statistics_sha256")]:
              assert hashlib.sha256((source/filename).read_bytes()).hexdigest() == m[key]
          dest.mkdir(parents=True, exist_ok=True)
          for name in expected:
              shutil.copyfile(source/name,dest/name)
          PY
          git add -- content/scenery/environment_overhaul/masks/{biome_rgba8.bin,manifest.json,understory.json,statistics.json}
          if git diff --cached --quiet; then echo "Verified package already tracked"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake verified canonical environment masks for pilot'
          git push origin HEAD:"$branch"
